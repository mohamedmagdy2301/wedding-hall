# Local PostgreSQL for development and integration tests (not used in production).
# wsproxy lets the Neon serverless driver (the production driver) talk to this
# local database over WebSockets, so local code runs the same path as Workers.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wedding_hall_dev
    ports:
      - "54329:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: "postgres:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "54330:80"
    depends_on:
      postgres:
        condition: service_healthy

  # S3-compatible stand-in for Cloudflare R2 (P9-01): the same aws4fetch code signs uploads
  # and short-lived links against it. The keys are local-only, not secrets.
  s3:
    image: versity/versitygw:v1.9.0
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: local-dev-key
      ROOT_SECRET_KEY: local-dev-secret
    ports:
      - "54331:7070"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
